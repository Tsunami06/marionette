[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-companion"
version = "0.1.0"
description = "Observable ADB/OCR foundation for an AI game companion, derived from Sunflower"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
device = [
  "adb-shell>=0.4.4,<0.5", "numpy>=1.24,<2", "opencv-python>=4.8,<4.11",
  "loguru>=0.7,<0.8", "psutil>=5.9,<7", "paddleocr>=2.7,<3",
  "paddlepaddle>=2.6,<3"
]

[project.scripts]
game-companion = "companion.cli:main"

[tool.setuptools.packages.find]
include = ["companion*", "sunflower*"]

[tool.setuptools.package-data]
sunflower = ["statics/*.json", "statics/images/*.jpg"]
